# Google Cloud Build - Deploy to Cloud Run
# Usage: gcloud builds submit --config cloudbuild.yaml

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ifm-syntax-pro:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/ifm-syntax-pro:latest', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ifm-syntax-pro:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ifm-syntax-pro'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ifm-syntax-pro:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/ifm-syntax-pro:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ifm-syntax-pro:latest'
